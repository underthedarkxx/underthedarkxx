<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Roberto Dias — Desenvolvedor Back-end">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090C"/>
      <stop offset="60%" stop-color="#0A0E13"/>
      <stop offset="100%" stop-color="#06181D"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="120%" r="85%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
