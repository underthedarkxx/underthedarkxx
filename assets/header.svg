  <rect width="1000" height="230" rx="14" fill="url(#glow)"/>
  <rect x="0" y="228" width="1000" height="2" fill="url(#line)"/>

  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="60" y="88" fill="#00E5FF" font-size="15" letter-spacing="6" font-weight="600">DESENVOLVEDOR BACK-END</text>
    <text x="58" y="150" fill="#EAF6F8" font-size="54" font-weight="700" letter-spacing="1">Roberto Dias</text>
    <text x="61" y="184" fill="#7C8B99" font-size="17">Java · Spring Boot · Python · Flask — Guarapari-ES, Brasil</text>
  </g>

  <g opacity="0.85">
    <circle cx="905" cy="62" r="4" fill="#00E5FF"/>
    <circle cx="930" cy="62" r="4" fill="#00E5FF" opacity="0.55"/>
    <circle cx="955" cy="62" r="4" fill="#00E5FF" opacity="0.25"/>
