name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 America/Sao_Paulo, todo dia
  workflow_dispatch: {} # botão "Run workflow" manual na aba Actions

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar SVGs atualizados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py

      - name: Commitar se algo mudou
        run: |
          if git diff --quiet -- assets/stats.svg assets/langs.svg; then
            echo "Nada mudou, pulando commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          git commit -m "chore: atualiza estatísticas do perfil [skip ci]"
          git push
